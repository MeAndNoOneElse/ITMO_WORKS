# SDK-1.1M onboard FT2232 debugger, STM32F427, full JTAG chain.
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi layout_init 0x0408 0x0ffb
ftdi layout_signal nSRST -oe 0x0800
set WORKAREASIZE 0x8000
transport select jtag
set CHIPNAME STM32F427VITx
set BOARDNAME SDK11M
set CLOCK_FREQ 500
reset_config srst_only srst_nogate connect_assert_srst
set CONNECT_UNDER_RESET 1
source [find target/stm32f4x.cfg]

# Boundary-scan TAP reported by this board as 0x06419041.
jtag newtap $CHIPNAME bs -irlen 5 -expected-id 0x06419041
adapter speed 500
