<style>
/* Макет: слева панель прототипа, справа «телефон»; на узких экранах приложение занимает весь экран */
:root{
  --bg:#F3F5FA;--surface:#FFFFFF;--surface2:#EBEEF6;--ink:#1B2340;--ink2:#566082;--line:#DFE3EF;

  --c-place:#C8402A;--c-time:#2B63C7;--c-poll:#7243C9;--c-check:#137A52;--c-result:#A35F00;

  --fs:1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1322;--surface:#171E35;--surface2:#212A47;--ink:#EDF0FA;--ink2:#A0A9C8;--line:#2B3556;
  --brand:#0A0F1E;--on-brand:#EDF0FA;--accent:#FF8168;--on-accent:#2A0E08;--accent-soft:#3A1F1A;
  --c-place:#FF8C78;--c-time:#7FA8FF;--c-poll:#B79BFF;--c-check:#4FD6A0;--c-result:#FFB84D;
  --good:#4FD6A0;--warn:#FFB84D;--bad:#FF8A80;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1322;--surface:#171E35;--surface2:#212A47;--ink:#EDF0FA;--ink2:#A0A9C8;--line:#2B3556;
  --brand:#0A0F1E;--on-brand:#EDF0FA;--accent:#FF8168;--on-accent:#2A0E08;--accent-soft:#3A1F1A;
  --c-place:#FF8C78;--c-time:#7FA8FF;--c-poll:#B79BFF;--c-check:#4FD6A0;--c-result:#FFB84D;
  --good:#4FD6A0;--warn:#FFB84D;--bad:#FF8A80;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
html{font-size:calc(16px*var(--fs))}
html,body{height:100%}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}

.avs{display:flex}.avs .av{border:2px solid var(--surface);margin-left:-8px}.avs .av:first-child{margin-left:0}

.pill.good{background:color-mix(in srgb,var(--good) 15%,var(--surface));color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:800;border:0}
.btn:hover{filter:brightness(1.06)}
.btn.sec2{background:var(--surface2);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}

.btn.sm{min-height:34px;padding:0 12px;border-radius:11px;font-size:.85rem}

.sw:checked::after{transform:translateX(18px);background:var(--on-accent)}
/* авторизация */
.auth{flex:1;min-height:0;overflow-y:auto;padding:28px 20px 24px;display:flex;flex-direction:column;gap:18px}
.logo{display:flex;align-items:center;gap:10px;font:700 1.5rem var(--f-d)}
.logo i{width:42px;height:42px;border-radius:13px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-style:normal}
.auth h1{font:700 2rem var(--f-d);line-height:1.1;text-wrap:balance}
.auth .lead{color:var(--ink2)}
.pinfan{display:flex;flex-direction:column;gap:8px;margin-block:4px}
.code{letter-spacing:.7em;text-align:center;font:700 1.6rem var(--f-d)}
/* чат */
.gh{display:flex;align-items:center;gap:10px;padding:10px 12px 8px;flex:none}
.gh .t{flex:1;min-width:0}.gh .t b{font:700 1.05rem var(--f-d);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gh .t small{color:var(--ink2);font-size:.8rem}
.tabs{display:flex;gap:4px;padding:0 12px;overflow-x:auto;flex:none;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}

.tabs button.on{color:var(--ink);border-color:var(--accent)}
.tabs .tb{min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--on-accent);font:800 .66rem/18px var(--f-b);text-align:center;padding:0 5px}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.day{align-self:center;font:800 .72rem var(--f-b);color:var(--ink2);background:var(--surface2);padding:3px 11px;border-radius:9px;margin-block:4px}
.m{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.bub{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 18px 5px;padding:8px 12px;display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left}
.m.me .bub{background:var(--accent-soft);border-color:transparent;border-radius:18px 18px 5px 18px}
.bub .nm{font:800 .74rem var(--f-b)}
.bub .tx{overflow-wrap:anywhere;white-space:pre-wrap}
.bub .tm{font-size:.68rem;color:var(--ink2);align-self:flex-end}
.rp{border-left:3px solid var(--accent);padding:2px 8px;font-size:.78rem;color:var(--ink2);background:var(--surface2);border-radius:6px}
.rx{display:flex;gap:4px;flex-wrap:wrap}
.rx span{font-size:.8rem;background:var(--surface2);border-radius:10px;padding:1px 7px;font-weight:700}
.rx span.me{background:var(--accent-soft)}
.sys{align-self:center;max-width:92%;text-align:center;font-size:.78rem;color:var(--ink2);background:var(--surface2);padding:5px 12px;border-radius:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.sys button{color:var(--accent);font-weight:800}
.pinchip{display:inline-flex;gap:6px;align-items:center;font:800 .74rem var(--f-b);color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface));padding:4px 10px;border-radius:10px;align-self:flex-start}
.photo{width:210px;max-width:100%;height:136px;border-radius:12px;display:grid;place-items:center;color:rgba(255,255,255,.85)}

.comp{flex:none;border-top:1px solid var(--line);background:var(--surface);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.comp .line{display:flex;gap:8px;align-items:center}
.comp .inp{min-height:42px;border-radius:21px;padding:8px 16px}

.opt.mine{border-color:var(--c-poll)}
.opt b{overflow-wrap:anywhere}
.chk{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}

.cb{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}

.hist{display:flex;gap:10px;align-items:flex-start;font-size:.85rem;padding:6px 0}
.hist .grow{flex:1;min-width:0}

.backdrop{position:absolute;inset:0;background:rgba(10,15,30,.5);z-index:20;animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;background:var(--bg);border-radius:26px 26px 0 0;z-index:21;display:flex;flex-direction:column;animation:up .22s ease-out;box-shadow:0 -10px 40px rgba(0,0,0,.25)}

@media (prefers-reduced-motion:reduce){.sheet,.backdrop{animation:none}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:9px auto 0;flex:none}
.sh-head{display:flex;align-items:center;gap:10px;padding:10px 16px 6px;flex:none}
.sh-head h2{flex:1;font:700 1.2rem var(--f-d);line-height:1.2;min-width:0;overflow-wrap:anywhere}
.sh-body{overflow-y:auto;padding:6px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}

.toast.show{opacity:1;transform:translate(-50%,0)}
.hl{display:flex;justify-content:space-between;gap:10px}
.tog{cursor:pointer}
.tog .grow small{display:block}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}.kv span:first-child{color:var(--ink2)}
.danger-zone{border:1.5px dashed color-mix(in srgb,var(--bad) 50%,var(--line));border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.faq summary{font-weight:700;cursor:pointer;padding:6px 0}.faq p{color:var(--ink2);font-size:.88rem;padding-bottom:6px}
</style>

</div>

/* ---------- время ---------- */
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function nextSat(){var d=new Date();var add=(6-d.getDay()+7)%7||7;d.setDate(d.getDate()+add);return d}
function fmtT(ts){return new Date(ts).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})}
function fmtDay(ts){var d=new Date(ts),n=new Date();var a=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(),b=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();var df=Math.round((b-a)/D);if(df===0)return 'Сегодня';if(df===1)return 'Вчера';return d.toLocaleDateString('ru',{day:'numeric',month:'long'})}
function ago(ts){var m=Math.round((Date.now()-ts)/60000);if(m<1)return 'только что';if(m<60)return m+' мин назад';var h=Math.round(m/60);if(h<24)return h+' ч назад';var d=Math.round(h/24);return d===1?'вчера':d+' дн. назад'}
function fmtWhen(d){if(!d||!d.date)return 'Дата не выбрана';var dt=new Date(d.date+'T'+(d.start||'00:00'));var s=dt.toLocaleDateString('ru',{weekday:'long',day:'numeric',month:'long'});if(d.start)s+=', '+d.start;if(d.end)s+='–'+d.end;return s}
function left(ts){var m=Math.round((ts-Date.now())/60000);if(m<=0)return 'срок вышел';if(m<60)return 'осталось '+m+' мин';var h=Math.round(m/60);if(h<48)return 'осталось '+h+' ч';return 'осталось '+Math.round(h/24)+' дн.'}

function prog(g){var ps=g.pins.filter(function(p){return p.status!=='archive'&&p.type!=='result'});return {d:ps.filter(function(p){return p.status==='done'}).length,t:ps.length}}
function pct(g){var p=prog(g);return p.t?Math.round(p.d/p.t*100):0}

function voters(d){var s={};d.options.forEach(function(o){o.votes.forEach(function(u){s[u]=1})});return Object.keys(s)}
function leader(d){var b=null;d.options.forEach(function(o){if(!b||o.votes.length>b.votes.length)b=o});return b&&b.votes.length?b.text:'нет голосов'}
function pinVal(g,p){var d=p.data;
  if(p.type==='place')return d.name+(d.address?' · '+d.address:'');
  if(p.type==='time')return fmtWhen(d);
  if(p.type==='poll')return d.closed?'Итог: '+leader(d):voters(d).filter(function(u){return active(g).indexOf(u)>-1}).length+' из '+active(g).length+' ответили · '+left(d.deadline);
  if(p.type==='check'){var t=d.items.length,tk=d.items.filter(function(i){return i.by}).length,dn2=d.items.filter(function(i){return i.done}).length;return 'взято '+tk+' из '+t+' · готово '+dn2}

function statusPill(p){return p.status==='done'?pill('Решено','good'):p.status==='archive'?pill('В архиве'):pill('Открыт','warn')}
function reqs(g){var out=[];if(g.status==='finished')return out;g.pins.forEach(function(p){if(p.status!=='open')return;
  if(p.type==='poll'&&!p.data.closed&&voters(p.data).indexOf('me')<0)out.push({g:g,p:p,txt:'Ответьте в опросе «'+p.data.question+'»',k:'poll'});
  if(p.type==='check'){var free=p.data.items.filter(function(i){return !i.by}).length;var mine=p.data.items.some(function(i){return i.by==='me'});if(free&&!mine)out.push({g:g,p:p,txt:'Возьмите пункт в чек-листе, свободно '+free,k:'check'})}});return out}

function unread(g){var me=meM(g);if(!me)return 0;return g.messages.filter(function(m){return m.by&&m.by!=='me'&&m.at>me.lastSeen}).length}
function lastAct(g){var l=g.at;g.messages.forEach(function(m){if(m.at>l)l=m.at});return l}
function when(g){var t=g.pins.find(function(p){return p.type==='time'&&p.data.date});return t?fmtWhen(t.data):'Дата не выбрана'}
function nextMeeting(){var best=null,now=Date.now()-6*H;S.gatherings.forEach(function(g){if(g.status==='finished')return;g.pins.forEach(function(p){if(p.type!=='time'||!p.data.date)return;var ts=new Date(p.data.date+'T'+(p.data.start||'00:00')).getTime();if(ts>=now&&(!best||ts<best.ts))best={g:g,ts:ts,p:p}})});return best}
function note(text,gid,pid,kind){var s=S.settings;if(kind==='poll'&&!s.n_poll)return;if(kind==='msg'&&!s.n_msg)return;S.notes.unshift({id:uid('n'),at:Date.now(),text:text,gid:gid||null,pid:pid||null,read:false})}
function sysMsg(g,text,pid){g.messages.push({id:uid('m'),by:null,at:Date.now(),type:'system',text:text,pin:pid})}
function tick(){var now=Date.now(),ch=false;S.gatherings.forEach(function(g){if(g.status==='finished')return;var act=active(g);g.pins.forEach(function(p){if(p.type!=='poll'||p.status!=='open')return;var d=p.data,v=voters(d);if(now>d.deadline||(act.length&&act.every(function(u){return v.indexOf(u)>-1}))){d.closed=true;p.status='done';p.doneAt=now;sysMsg(g,'Опрос «'+d.question+'» завершён. Итог: '+leader(d),p.id);note('Итог опроса «'+d.question+'»: '+leader(d),g.id,p.id,'poll');ch=true}})});if(ch)save()}

  $('#guide').innerHTML='<h2>Прототип «Сбор»</h2><p>Кликабельная модель по информационной архитектуре. Все данные демонстрационные и хранятся только в вашем браузере.</p>'+L.map(function(s){return '<div class="gl"><small>'+s[0]+'</small>'+s[1].map(function(i){return '<button data-act="go" data-to="'+i[1]+'" class="'+(cur===i[1]?'on':'')+'">'+i[0]+'</button>'}).join('')+'</div>'}).join('')+'<p class="note">Вход: любой номер из 10 цифр и код 1234. Кнопка «Попробовать без регистрации» войдёт сразу.</p>'}

/* ---------- отрисовка ---------- */
function render(){tick();var scr={};document.querySelectorAll('[data-sk]').forEach(function(el){scr[el.dataset.sk]=el.scrollTop});var a=document.activeElement,aid=a&&a.id,ss=null,se=null;try{ss=a.selectionStart;se=a.selectionEnd}catch(e){}
  $('#screen').innerHTML=S.session?vApp():vAuth();$('#sheet').innerHTML=(S.session&&ui.sheet)?vSheet():'';guide();
  document.querySelectorAll('[data-sk]').forEach(function(el){if(scr[el.dataset.sk]!=null)el.scrollTop=scr[el.dataset.sk]});
  var ch=$('.msgs');if(ch&&ui.stick){ch.scrollTop=ch.scrollHeight;ui.stick=false}
  if(aid){var n=document.getElementById(aid);if(n&&n!==document.activeElement){n.focus();try{if(ss!=null)n.setSelectionRange(ss,se)}catch(e){}}}}

/* ---------- события ---------- */
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el||el.disabled)return;var f=ACT[el.dataset.act];if(f){e.preventDefault();f(el.dataset,el)}});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&ui.sheet){closeSheet();return}
  var t=e.target;
  if(e.key==='Enter'&&t.dataset&&t.dataset.enter){e.preventDefault();ACT[t.dataset.enter](t.dataset);return}
  if((e.key==='Enter'||e.key===' ')&&t.getAttribute&&t.getAttribute('role')==='button'&&t.dataset.act){e.preventDefault();t.click()}});
document.addEventListener('input',function(e){var t=e.target,d=t.dataset;if(!d)return;
  if(d.auth==='phone'){var raw=t.value,dg=raw.replace(/\D/g,'');if(raw.charAt(0)==='+')dg=dg.slice(1);else if((dg[0]==='8'||dg[0]==='7')&&(dg.length>10||dg.length===1))dg=dg.slice(1);dg=dg.slice(0,10);ui.auth.phone=dg;t.value=fmtPhone(dg);ui.auth.err='';return}
  if(d.auth==='code'){t.value=t.value.replace(/\D/g,'').slice(0,4);if(t.value.length===4)checkCode();return}
  if(d.q){ui.q=t.value;render();return}
  if(d.arr){(ui.form[d.arr]=ui.form[d.arr]||[])[+d.i]=t.value;return}
  if(d.f&&t.type!=='checkbox'){ui.form[d.f]=t.value;if(d.live)render()}});
document.addEventListener('change',function(e){var t=e.target,d=t.dataset;if(!d)return;
  if(d.f&&t.type==='checkbox'){ui.form[d.f]=t.checked;return}
  if(d.f&&(t.tagName==='SELECT'||t.type==='date'||t.type==='time')){ui.form[d.f]=t.value;return}
  if(d.s){var v=t.type==='checkbox'?t.checked:t.value;S.settings[d.s]=v;save();if(d.s==='quiet')render()}});

/* ---------- запуск ---------- */
applyPrefs();render();
})();
</script>
