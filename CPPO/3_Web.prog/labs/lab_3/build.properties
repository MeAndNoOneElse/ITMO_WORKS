main.class=service.AreaCheckService

# --- Структура каталогов ---
src.dir=src/main/java
web.dir=src/main/webapp
resources.dir=src/main/resources
lib.dir=lib
build.dir=build
doc.dir=doc
classes.dir=${build.dir}/classes
dist.dir=${build.dir}/dist
test.dir=src/test/java
test.src.dir=src/test/java
test.classes.dir=${build.dir}/test-classes
test.reports.dir=${build.dir}/test-reports
docs.dir=docs

app.name=web_lab_3
app.version=4
# --- Имена архивов ---
war.name=${app.name}.war
jar.name=${app.name}-${app.version}.jar
zip.name=${app.name}-team.zip

# --- Версия Java ---
java.source=17
java.target=17
java.encoding=UTF-8
env.java.versions=5,8,11,17,21,25

# --- Jakarta EE / сервлет API (provided — не входят в WAR) ---
servlet.api.jar=${lib.dir}/jakarta.servlet-api-6.0.0.jar
faces.api.jar=${lib.dir}/jakarta.faces-api-4.0.1.jar
cdi.api.jar=${lib.dir}/jakarta.enterprise.cdi-api-4.0.1.jar
persistence.api.jar=${lib.dir}/jakarta.persistence-api-3.1.0.jar
ws.rs.api.jar=${lib.dir}/jakarta.ws.rs-api-3.1.0.jar

# --- Зависимости runtime ---
eclipselink.jar=${lib.dir}/eclipselink-4.0.2.jar
postgresql.jar=${lib.dir}/postgresql-42.7.7.jar
primefaces.jar=${lib.dir}/primefaces-14.0.0-jakarta.jar
jstl.api.jar=${lib.dir}/jakarta.servlet.jsp.jstl-api-3.0.0.jar
jstl.impl.jar=${lib.dir}/jakarta.servlet.jsp.jstl-3.0.1.jar
transaction.api.jar=${lib.dir}/jakarta.transaction-api-2.0.1.jar
javac.source=17
javac.target=17
javac.debug=true
# --- JUnit ---
junit.platform.console.jar=${lib.dir}/junit-platform-console-standalone-1.10.2.jar
mockito.core=${lib.dir}/mockito-core-5.11.0.jar
mockito.inline=${lib.dir}/mockito-inline-5.11.0.jar
bytebuddy.jar=${lib.dir}/byte-buddy-1.14.11.jar
bytebuddy.agent=${lib.dir}/byte-buddy-agent-1.14.11.jar

# --- Локализация ---
locale.src.dir=${resources.dir}/locale
locale.out.dir=${classes.dir}/locale

# --- XML-файлы проекта ---
xml.files=${web.dir}/WEB-INF/web.xml,${web.dir}/WEB-INF/beans.xhtml,${web.dir}/WEB-INF/faces-config.xml

# --- Классы для diff (при изменении которых делается commit) ---
diff.classes=AreaCheckService,PointCheckBean,ResultsBean,CacheSwitcherBean,XValidator,YValidator,RValidator

# --- Параметры замены для alt (replace/replaceregexp) ---
alt.prefix=zoo
old.package.prefix=service
alt.package.prefix=zooservice

# --- SVN ---
svn.url=https://svn.example.com/repo/lab3
svn.commit.message=Auto-commit: changed classes from diff list

# --- Музыка (пути к файлам для воспроизведения после build) ---
music.success.file=${resources.dir}/music/probitie-2.wav
music.failure.file=${resources.dir}/music/ne-probil.wav
music.file=${music.success.file}

